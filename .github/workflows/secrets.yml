name: secrets-scan

# Openbare repo (26 nov 2026): alleen een geheimenscan. Er staat geen code in, alleen
# plugin-JSON en markdown; Semgrep en Trivy hebben hier niets te zien. De MCP-servers
# gebruiken OAuth, dus een sleutel in een .mcp.json zou altijd een vergissing zijn.
# detect-secrets-HOOK, niet `detect-secrets scan --baseline` (die eindigt altijd 0);
# exit 3 is alleen baseline-boekhouding en dus groen. Baseline op Linux gemaakt.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: python -m pip install detect-secrets==1.5.0 # pragma: allowlist secret
      - name: detect-secrets-hook (rood op een NIEUW geheim)
        run: |
          git ls-files -z | xargs -0 sh -c '
            detect-secrets-hook "$@"
            rc=$?
            if [ "$rc" -eq 3 ]; then exit 0; fi
            exit "$rc"
          ' _ --baseline .secrets.baseline
